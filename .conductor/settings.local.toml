"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install"
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port $CONDUCTOR_PORT"
available_in = [ "local" ]
default = true
icon = "play"

[scripts.run.preview]
command = "npm run build && npm run preview -- --port $CONDUCTOR_PORT"
available_in = [ "local" ]
icon = "eye"
